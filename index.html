<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123e3c">
  <meta name="description" content="簡文山教授｜台北醫學大學管理學院大數據研究所電子名片">
  <title>簡文山教授｜電子名片</title>
  <style>
    :root{color-scheme:light;--ink:#123e3c;--muted:#647775;--paper:#f4f5ef;--line:#dce3db;--gold:#d9c595}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.65}button,select,a{-webkit-tap-highlight-color:transparent}button,select{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #c69842;outline-offset:5px}
    .shell{max-width:1120px;margin:auto;padding:32px 40px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:48px}.brand{font-size:12px;font-weight:700;letter-spacing:.17em;display:flex;align-items:center;gap:12px}.brand-icon{width:30px;height:30px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-size:16px;letter-spacing:0}.language{display:flex;align-items:center;gap:10px}.language label{font-size:12px;color:var(--muted)}select{background:transparent;color:var(--ink);padding:9px 30px 9px 12px;border:1px solid #c8d3c9;border-radius:8px;max-width:180px}
    main{display:grid;grid-template-columns: .85fr 1.15fr;min-height:590px;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #163f3b0c;border:1px solid var(--line)}.portrait{background:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:40px;color:#f6f5ea}.portrait:before,.portrait:after{content:"";position:absolute;border:1px solid #d9c59535;border-radius:50%;width:400px;height:400px;right:-185px;top:80px}.portrait:after{width:520px;height:520px;right:-245px;top:20px}.plate-label{font-size:11px;letter-spacing:.2em;color:var(--gold);z-index:1}.monogram{font-family:serif;font-size:112px;line-height:1;letter-spacing:.05em;z-index:1;margin:55px 0}.portrait-bottom{z-index:1}.rule{width:40px;height:2px;background:var(--gold);margin-bottom:22px}.portrait-bottom p{margin:6px 0;font-size:14px;color:#dce7dc}.portrait-bottom .micro{font-size:10px;letter-spacing:.19em;color:var(--gold)}
    .details{padding:48px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.16em;margin:0 0 22px}.name{font-size:clamp(32px,4vw,48px);font-weight:600;letter-spacing:.04em;line-height:1.3;margin:0 0 12px;overflow-wrap:anywhere}.title{display:inline-block;align-self:flex-start;border:1px solid var(--line);border-radius:30px;padding:3px 15px;font-size:13px;margin-bottom:24px}.affiliation{font-size:17px;font-weight:600;line-height:1.7;margin:0}.institute{font-size:15px;color:var(--muted);margin:3px 0 28px}.address{border-top:1px solid var(--line);padding-top:24px;display:flex;align-items:flex-start;gap:12px}.address svg{flex-shrink:0;margin-top:4px}.address-label{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:5px}address{font-style:normal;font-size:14px;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:30px}.action{border:1px solid var(--line);border-radius:9px;padding:12px 10px;text-align:center;text-decoration:none;font-size:13px;background:white;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px}.action.primary{background:var(--ink);color:white;border-color:var(--ink)}.action:hover{filter:brightness(.94)}.copy{align-self:flex-start;border:0;padding:0;background:none;color:var(--muted);font-size:12px;margin-top:16px;text-decoration:underline;text-underline-offset:4px}.footer{display:flex;justify-content:space-between;gap:20px;margin-top:24px;font-size:11px;color:var(--muted)}#status{min-height:24px;margin-top:12px;font-size:13px;color:var(--ink)}
    @media(max-width:720px){.shell{padding:20px}.topbar{margin-bottom:24px;align-items:flex-start}.brand{font-size:10px;letter-spacing:.08em}.language label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}select{font-size:13px;max-width:145px}main{grid-template-columns:1fr;border-radius:18px}.portrait{min-height:225px;padding:28px;flex-direction:row;flex-wrap:wrap;align-items:center}.plate-label{width:100%}.monogram{font-size:74px;margin:24px 0}.portrait-bottom{max-width:60%}.portrait-bottom p{font-size:12px}.portrait:before{top:-110px}.portrait:after{top:-170px}.details{padding:30px 26px}.eyebrow{margin-bottom:18px}.footer{font-size:10px;flex-wrap:wrap;gap:6px}.actions{margin-top:24px}}@media(max-width:360px){.shell{padding:12px}.details{padding:26px 20px}.actions{grid-template-columns:1fr}.brand-icon{display:none}}@media print{body{background:white}.shell{padding:0}.topbar,.actions,.copy,.footer,#status{display:none}main{box-shadow:none;min-height:450px}.portrait{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" aria-hidden="true">山</span><span data-i18n="brand">學術電子名片</span></div>
      <div class="language"><label for="language" data-i18n="language">語言</label><select id="language" aria-label="語言 / Language"><option value="auto">自動 / Auto</option><option value="zh">繁體中文</option><option value="en">English</option><option value="ja">日本語</option><option value="ko">한국어</option><option value="vi">Tiếng Việt</option></select></div>
    </header>
    <main aria-labelledby="name">
      <section class="portrait" aria-label="個人識別 / Personal identity">
        <div class="plate-label">KNOWLEDGE · DATA · IMPACT</div>
        <div class="monogram" aria-hidden="true">山<span style="color:var(--gold);font-size:.4em">.</span></div>
        <div class="portrait-bottom"><div class="rule"></div><p data-i18n="university">台北醫學大學</p><p data-i18n="college">管理學院</p><p class="micro">TAIPEI MEDICAL UNIVERSITY</p></div>
      </section>
      <section class="details">
        <p class="eyebrow" data-i18n="eyebrow">學術 / 大數據</p>
        <h1 class="name" id="name" data-i18n="name">簡文山</h1>
        <div class="title" data-i18n="title">教授</div>
        <p class="affiliation" data-i18n="university">台北醫學大學</p>
        <p class="institute"><span data-i18n="college">管理學院</span><br><span data-i18n="institute">大數據研究所</span></p>
        <div class="address"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><div><div class="address-label" data-i18n="addressLabel">聯絡地址</div><address data-i18n="address">新北市中和區圓通路301號<br>11樓管理學院</address></div></div>
        <div class="actions"><button type="button" class="action primary" id="save" data-i18n="save">↓ 儲存聯絡人</button><a class="action" id="map" href="https://www.google.com/maps/search/?api=1&amp;query=%E6%96%B0%E5%8C%97%E5%B8%82%E4%B8%AD%E5%92%8C%E5%8D%80%E5%9C%93%E9%80%9A%E8%B7%AF301%E8%99%9F" target="_blank" rel="noopener noreferrer" data-i18n="map">↗ 查看地圖</a></div>
        <button class="copy" type="button" id="copy" data-i18n="copy">複製名片資訊</button><div id="status" role="status" aria-live="polite"></div>
      </section>
    </main>
    <footer class="footer"><span data-i18n="footer">以數據連結知識，讓交流更簡單。</span><span data-i18n="autoNote">五種語言 · 自動適應您的螢幕</span></footer>
  </div>
  <script>
    const translations={
      zh:{lang:'zh-Hant',brand:'學術電子名片',language:'語言',eyebrow:'學術 / 大數據',name:'簡文山',title:'教授',university:'台北醫學大學',college:'管理學院',institute:'大數據研究所',addressLabel:'聯絡地址',address:'新北市中和區圓通路301號\n11樓管理學院',save:'↓ 儲存聯絡人',map:'↗ 查看地圖',copy:'複製名片資訊',copied:'已複製名片資訊。',failed:'無法自動複製，請選取名片文字後複製。',saved:'已產生聯絡人檔案，請開啟下載的 .vcf 檔案匯入。',footer:'以數據連結知識，讓交流更簡單。',autoNote:'五種語言 · 自動適應您的螢幕'},
      en:{lang:'en',brand:'ACADEMIC PROFILE',language:'Language',eyebrow:'ACADEMIA / BIG DATA',name:'Wen-Shan Chien',title:'Professor',university:'Taipei Medical University',college:'College of Management',institute:'Graduate Institute of Big Data',addressLabel:'CONTACT ADDRESS',address:'College of Management, 11F, No. 301, Yuantong Rd.\nZhonghe District, New Taipei City, Taiwan',save:'↓ Save contact',map:'↗ View map',copy:'Copy card details',copied:'Card details copied.',failed:'Please select and copy the card text manually.',saved:'Contact file created. Open the downloaded .vcf file to import it.',footer:'Connecting knowledge through data.',autoNote:'Five languages · Every screen'},
      ja:{lang:'ja',brand:'デジタル名刺',language:'言語',eyebrow:'学術 / ビッグデータ',name:'簡 文山',title:'教授',university:'台北医学大学',college:'管理学院',institute:'ビッグデータ研究所',addressLabel:'連絡先住所',address:'台湾 新北市中和区圓通路301号\n11階 管理学院',save:'↓ 連絡先を保存',map:'↗ 地図を見る',copy:'名刺情報をコピー',copied:'名刺情報をコピーしました。',failed:'名刺の文字を選択してコピーしてください。',saved:'連絡先ファイルを作成しました。ダウンロードした .vcf ファイルを開いてください。',footer:'データで知識をつなぎ、交流を身近に。',autoNote:'5言語対応 · あらゆる画面にフィット'},
      ko:{lang:'ko',brand:'디지털 명함',language:'언어',eyebrow:'학술 / 빅데이터',name:'簡文山',title:'교수',university:'타이베이 의학대학교',college:'경영대학',institute:'빅데이터 연구소',addressLabel:'연락처 주소',address:'대만 신베이시 중허구 위안퉁로 301호\n11층 경영대학',save:'↓ 연락처 저장',map:'↗ 지도 보기',copy:'명함 정보 복사',copied:'명함 정보를 복사했습니다.',failed:'명함의 텍스트를 선택하여 직접 복사해 주세요.',saved:'연락처 파일을 생성했습니다. 다운로드한 .vcf 파일을 열어 가져오세요.',footer:'데이터로 지식을 연결합니다.',autoNote:'5개 언어 · 모든 화면에 맞게'},
      vi:{lang:'vi',brand:'DANH THIẾP ĐIỆN TỬ',language:'Ngôn ngữ',eyebrow:'HỌC THUẬT / DỮ LIỆU LỚN',name:'Giản Văn Sơn',title:'Giáo sư',university:'Đại học Y Đài Bắc',college:'Khoa Quản lý',institute:'Viện Nghiên cứu Dữ liệu lớn',addressLabel:'ĐỊA CHỈ LIÊN HỆ',address:'Khoa Quản lý, tầng 11, số 301, đường Yuantong\nQuận Zhonghe, thành phố Tân Bắc, Đài Loan',save:'↓ Lưu liên hệ',map:'↗ Xem bản đồ',copy:'Sao chép danh thiếp',copied:'Đã sao chép thông tin danh thiếp.',failed:'Vui lòng chọn và sao chép văn bản trên danh thiếp.',saved:'Đã tạo tệp liên hệ. Mở tệp .vcf đã tải xuống để nhập.',footer:'Kết nối tri thức thông qua dữ liệu.',autoNote:'5 ngôn ngữ · Phù hợp mọi màn hình'}
    };
    // English name and translated institute names are editable translations, not verified official names.
    const selector=document.getElementById('language');let current='zh';
    function detect(){for(const language of navigator.languages||[navigator.language]){const key=language.toLowerCase().split('-')[0];if(translations[key])return key}return 'zh'}
    function render(value){current=value==='auto'?detect():value;const t=translations[current];document.documentElement.lang=t.lang;document.title=t.name+' | '+t.brand;document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t[el.dataset.i18n];if(el.tagName==='ADDRESS')el.style.whiteSpace='pre-line'});document.getElementById('status').textContent=''}
    let preference='auto';try{const saved=localStorage.getItem('business-card-language');if(saved==='auto'||translations[saved])preference=saved}catch{}selector.value=preference;render(preference);
    selector.addEventListener('change',()=>{try{localStorage.setItem('business-card-language',selector.value)}catch{}render(selector.value)});window.addEventListener('languagechange',()=>{if(selector.value==='auto')render('auto')});
    function details(){const t=translations[current];return [t.name+' / 簡文山',t.title,t.university,t.college,t.institute,t.address].join('\n')}
    document.getElementById('copy').addEventListener('click',async()=>{let success=false;try{await navigator.clipboard.writeText(details());success=true}catch{const area=document.createElement('textarea');area.value=details();area.style.cssText='position:fixed;left:-9999px';document.body.append(area);area.select();try{success=document.execCommand('copy')}catch{}area.remove();document.getElementById('copy').focus()}document.getElementById('status').textContent=translations[current][success?'copied':'failed']});
    document.getElementById('save').addEventListener('click',()=>{const card=['BEGIN:VCARD','VERSION:3.0','N;CHARSET=UTF-8:簡;文山;;;','FN;CHARSET=UTF-8:簡文山','ORG;CHARSET=UTF-8:台北醫學大學;管理學院 大數據研究所','TITLE;CHARSET=UTF-8:教授','ADR;TYPE=WORK;CHARSET=UTF-8:;11樓管理學院;圓通路301號;中和區;新北市;;台灣','END:VCARD',''].join('\r\n');const url=URL.createObjectURL(new Blob([card],{type:'text/vcard;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='簡文山-聯絡人.vcf';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);document.getElementById('status').textContent=translations[current].saved});
  </script>
</body>
</html>
